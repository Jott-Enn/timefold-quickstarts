########################
# Timefold Solver properties
########################

# The solver runs for 30 seconds. To run for 5 minutes use "5m" and for 2 hours use "2h".
quarkus.timefold.solver.termination.spent-limit=30s

# To change how many solvers to run in parallel
# timefold.solver-manager.parallel-solver-count=4

# Temporary comment this out to detect bugs in your code (lowers performance)
# quarkus.timefold.solver.environment-mode=FULL_ASSERT

# Temporary comment this out to return a feasible solution as soon as possible
# quarkus.timefold.solver.termination.best-score-limit=0hard/0medium/*soft

# To see what Timefold is doing, turn on DEBUG or TRACE logging.
quarkus.log.category."ai.timefold.solver".level=INFO
# For TRACE logging also activate this:
# quarkus.log.min-level=TRACE
%test.quarkus.log.category."ai.timefold.solver".level=INFO
%prod.quarkus.log.category."ai.timefold.solver".level=INFO

# XML file for power tweaking, defaults to solverConfig.xml (directly under src/main/resources)
#quarkus.timefold.solver-config-xml=org/acme/vehiclerouting/solver/vehicleRoutingSolverConfig.xml

########################
# Road snapping
########################

# Demo data and clicked visits are moved onto the nearest drivable road (OSRM table service, see OsrmRoadSnapper).
# If the server cannot be reached, locations stay where they are.
vehicle-routing.road-snapping.enabled=true
vehicle-routing.road-snapping.osrm-url=https://router.project-osrm.org
vehicle-routing.road-snapping.profile=driving
vehicle-routing.road-snapping.timeout=10s
# Tests must not depend on a public server; OsrmRoadSnapperTest covers snapping against a local stub.
%test.vehicle-routing.road-snapping.enabled=false

########################
# Enterprise Edition properties
########################

# To run increase CPU cores usage per solver
%enterprise.quarkus.timefold.solver.move-thread-count=AUTO

# To enable Nearby auto-configuration
%enterprise.quarkus.timefold.solver.nearby-distance-meter-class=org.acme.vehiclerouting.domain.LocationDistanceMeter

########################
# Native build properties
########################

# Enable Swagger UI also in the native mode
quarkus.swagger-ui.always-include=true

########################
# Test overrides
########################
# Effectively disable this termination in favor of the best-score-limit
%test.quarkus.timefold.solver.termination.spent-limit=1h
%test.quarkus.timefold.solver.termination.best-score-limit=0hard/0medium/*soft

# Workaround for https://github.com/quarkusio/quarkus/issues/55362
quarkus.rest.jackson.optimization.enable-reflection-free-serializers=false
########################
# Sightline (in-app findings tool; dev and test build profiles only, see CLAUDE.md)
########################
# Findings are filed here, relative to the directory the app is started from (the project directory in dev mode).
sightline.findings-dir=docs/findings
%test.sightline.findings-dir=target/sightline-test-findings
# A finding carries a PNG (up to 2560 px) plus the full route plan as base64 JSON.
%dev.quarkus.http.limits.max-body-size=40M
%test.quarkus.http.limits.max-body-size=40M
# Production packages ship neither the button script, the findings page nor the filing endpoint: the classes are
# already inactive through @IfBuildProfile; this keeps them and their assets out of the jar altogether.
# (BackendJournal stays: the solver resource calls it, and it is a no-op unless the dev/test startup bean enables it.)
%prod.quarkus.package.jar.user-configured-ignored-entries=sightline/client.js,sightline/findings.html,sightline/findings.js,org/acme/vehiclerouting/sightline/SightlineResource.class,org/acme/vehiclerouting/sightline/SightlineStartup.class,org/acme/vehiclerouting/sightline/SightlineStartup$1.class,org/acme/vehiclerouting/sightline/SightlineRequestFilter.class,org/acme/vehiclerouting/sightline/FindingStore.class,org/acme/vehiclerouting/sightline/FindingStore$InvalidFindingException.class,org/acme/vehiclerouting/sightline/FindingEnricher.class
